<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Owl</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Flappy Owl</h1>
    <p class="tagline">Fly the owl through the columns of campus. Go Owls!</p>

    <!-- The whole game is drawn inside this canvas by script.js -->
    <canvas id="game" width="400" height="600"></canvas>

    <p class="help">
      Press <kbd>Space</kbd>, click, or tap to flap.
      <button id="mute" type="button">Sound: On</button>
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
